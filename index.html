<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杨百万B站数据看板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <!-- 顶部横幅 -->
    <header class="hero">
      <h1 class="hero-title">🐰 杨百万B站数据看板</h1>
      <p class="hero-sub">助力冲刺 100w 目标</p>
      <p id="statusText" class="status-text">加载中…</p>
    </header>

    <!-- 日期筛选 + 刷新 -->
    <div class="date-bar">
      <label class="date-filter">
        <span>日期</span>
        <select id="dateSelect"></select>
      </label>
      <button id="btnRefresh" class="btn primary">刷新</button>
    </div>

    <!-- 汇总卡片 -->
    <section class="cards" id="cards"></section>

    <!-- 播放进度（目标 100 万） -->
    <section id="progress" class="progress-grid"></section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
