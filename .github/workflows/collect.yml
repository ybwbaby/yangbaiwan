name: collect

on:
  schedule:
    # 每 30 分钟（每小时 :00 与 :30）采集一次，对齐到半小时整点
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yangbaiwan-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector
        run: python fetch_bili.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json latest.json video_list_cache.json
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "collect: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
